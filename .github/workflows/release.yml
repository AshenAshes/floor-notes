name: Release

on:
  push:
    tags:
      - "v[0-9]*.[0-9]*.[0-9]*"

permissions:
  contents: read

jobs:
  verify-release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out tagged source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Validate release tag format
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "Release tags must use the exact vX.Y.Z format."
            exit 1
          fi

      - name: Install dependencies
        run: npm ci

      - name: Verify project
        run: npm run verify

      - name: Verify release tag and version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: npm run check:release

      - name: Inspect npm package
        run: npm pack --dry-run

      - name: Upload verified release assets
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-assets
          path: |
            main.js
            manifest.json
            styles.css
          if-no-files-found: error
          retention-days: 7

  publish-release:
    needs: verify-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: floor-notes-release-${{ github.repository }}
      cancel-in-progress: false
    steps:
      - name: Download verified release assets
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-assets
          path: release-assets

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            release-assets/main.js \
            release-assets/manifest.json \
            release-assets/styles.css \
            --verify-tag \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
